
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1>Cine<span>Box</span></h1>

        <div class="links">
            <a href="#">Home</a>
            <a href="#movies">Movies</a>
            <a href="#">Series</a>
        </div>

        <input type="text" id="search" placeholder="Search movie...">
    </nav>

    <section class="hero">
        <div class="hero-content">
            <p class="tag">#1 TRENDING MOVIE</p>
            <h2>THE DARK<br>KNIGHT</h2>
            <p>Action • Adventure • 2008</p>
            <button onclick="playMovie()">▶ Watch Now</button>
        </div>
    </section>

    <section class="movies" id="movies">
        <h2>Trending Now</h2>

        <div class="movie-container">

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg">
                <h3>Oppenheimer</h3>
                <p>⭐ 8.3 | Drama</p>
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg">
                <h3>The Shawshank Redemption</h3>
                <p>⭐ 9.3 | Drama</p>
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg">
                <h3>Spider-Man</h3>
                <p>⭐ 8.2 | Action</p>
            </div>

            <div class="movie-card">
                <img src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg">
                <h3>Dune</h3>
                <p>⭐ 8.0 | Sci-Fi</p>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
